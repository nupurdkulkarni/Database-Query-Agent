services:
  # The FastAPI backend
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file: ../.env
    volumes:
      - ../data:/app/data
    restart: always

  # The React frontend + Nginx
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always

