line-length = 120
target-version = "py310"

# Exclude scratch files and notebooks from strict linting
exclude = [
    "scratch_*.py",
    "*.ipynb",
    "node_modules",
    "dist",
    "build",
    "venv",
    ".venv",
]

[lint]
# Enable Pyflakes (F) and pycodestyle (E, W) codes by default.
# Also enable Bugbear (B), Isort (I), and Pydocstyle (D).
select = ["E", "F", "W", "B", "I", "C90", "N", "UP", "ASYNC", "S", "A", "T20", "RET", "SIM", "ARG", "PTH", "ERA", "PL"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D107", "S101", "PLR0913"]

[lint.mccabe]
max-complexity = 15

[lint.isort]
known-first-party = ["backend", "frontend"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
